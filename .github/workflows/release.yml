name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialize retries of the same tag.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    name: Update the qcms bindings in pdf.js
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history is needed to check that the release isn't a downgrade.
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # No cache: it could be poisoned and end up in the release.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build the bindings
        run: |
          mkdir -p "${RUNNER_TEMP}/out"
          node build.js --compile --output "${RUNNER_TEMP}/out"

      - name: Verify and read the build metadata
        id: info
        run: |
          expected=$(git rev-parse HEAD)
          node - "${RUNNER_TEMP}/out/qcms_bg.wasm" "${expected}" <<'EOF'
          const { appendFileSync } = require("node:fs");
          const { readBuildMetadata } = require("./build_metadata.js");
          const [, , filename, expected] = process.argv;
          const info = readBuildMetadata(filename);
          if (info === undefined) {
            throw new Error("No build_info section in qcms_bg.wasm");
          }
          if (info.repo !== expected) {
            throw new Error(`The wasm was built from ${info.repo}, expected ${expected}`);
          }
          const outputs = ["qcms", "repo", "rustc", "wasmBindgen"].map((key) => {
            const value = info[key];
            if (typeof value !== "string" || !value || /[^\w.-]/.test(value)) {
              throw new Error(`Invalid ${key} in build_info: ${value}`);
            }
            return `${key}=${value}\n`;
          });
          appendFileSync(process.env.GITHUB_OUTPUT, outputs.join(""));
          EOF

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mozilla
          repositories: pdf.js
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout pdf.js
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/pdf.js
          path: pdf.js
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Create the pull request
        working-directory: pdf.js
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          REPO_REVISION: ${{ steps.info.outputs.repo }}
          QCMS_VERSION: ${{ steps.info.outputs.qcms }}
          RUSTC_VERSION: ${{ steps.info.outputs.rustc }}
          WASM_BINDGEN_VERSION: ${{ steps.info.outputs.wasmBindgen }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! ${VERSION} =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          REPO=mozilla/pdf.js
          BASE=master
          BRANCH="update-qcms-${VERSION}"
          BRANCH_REF="refs/heads/${BRANCH}"
          TITLE="Update qcms bindings to version ${VERSION}"
          FILES=(external/qcms/{qcms.js,qcms_bg.wasm,qcms_utils.js})

          # A merged release stays complete even if its branch has been deleted.
          PR_URL=$(gh api --paginate "repos/${REPO}/pulls?head=${REPO%/*}:${BRANCH}&base=${BASE}&state=all" |
            jq -rs --arg repo "${REPO}" '
              first(.[][] | select(.head.repo.full_name == $repo and
                (.state == "open" or .merged_at != null)) | .html_url) // empty
            ')
          if [ -n "${PR_URL}" ]; then
            echo "A pull request already exists for ${BRANCH}: ${PR_URL}"
            exit 0
          fi

          # Only replace bindings built from an ancestor of this revision, so that
          # retrying an old tag can't revert a newer release.
          VENDORED_REVISION=$(node - "external/qcms/qcms_bg.wasm" <<'EOF'
          const { readBuildMetadata } = require("../build_metadata.js");
          const info = readBuildMetadata(process.argv[2]);
          if (info !== undefined) {
            const { repo } = info;
            if (typeof repo !== "string" || !/^[0-9a-f]{40}$/.test(repo)) {
              throw new Error(`Unable to compare with the vendored bindings built from ${repo}`);
            }
            process.stdout.write(repo);
          }
          EOF
          )
          if [[ -z ${VENDORED_REVISION} ]]; then
            echo "The vendored bindings have no build metadata."
          elif ! git -C "${GITHUB_WORKSPACE}" merge-base --is-ancestor \
              "${VENDORED_REVISION}" "${REPO_REVISION}"; then
            echo "The vendored bindings were built from ${VENDORED_REVISION}, which isn't an ancestor of ${REPO_REVISION}." >&2
            exit 1
          fi

          for FILE in "${FILES[@]}"; do
            cp "${RUNNER_TEMP}/out/${FILE##*/}" "${FILE}"
          done
          git add -- "${FILES[@]}"
          if git diff --cached --quiet; then
            echo "The qcms bindings in pdf.js are already up to date."
            exit 0
          fi

          # An empty lease requires the branch to be absent.
          LEASE=
          REMOTE_BRANCH=$(git ls-remote --refs origin "${BRANCH_REF}")
          if [[ -n ${REMOTE_BRANCH} ]]; then
            # Verify the old branch before replacing it with a commit on the current base.
            git fetch --no-tags --depth=1 origin "${BRANCH_REF}"
            LEASE=$(git rev-parse FETCH_HEAD)
            if ! git diff --cached --quiet "${LEASE}" -- "${FILES[@]}"; then
              echo "The existing branch ${BRANCH} does not match the rebuilt bindings." >&2
              exit 1
            fi
          fi

          git -c 'user.name=github-actions[bot]' \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "${TITLE}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          git push --force-with-lease="${BRANCH_REF}:${LEASE}" origin "HEAD:${BRANCH_REF}"

          gh pr create --repo "${REPO}" --base "${BASE}" --head "${BRANCH}" \
            --title "${TITLE}" --body-file - <<EOF
          - pdf.js.qcms version: ${VERSION}
          - pdf.js.qcms commit: [\`${REPO_REVISION}\`](https://github.com/mozilla/pdf.js.qcms/commit/${REPO_REVISION})
          - qcms version: [${QCMS_VERSION}](https://crates.io/crates/qcms/${QCMS_VERSION})
          - wasm-bindgen version: ${WASM_BINDGEN_VERSION}
          - Rust version: ${RUSTC_VERSION}
          EOF
